name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Java JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Initialize & Build APK
        run: |
          # إنشاء مشروع Android تلقائي من الـ Manifest
          bubblewrap init --manifest=https://my-app.com/manifest.json --directory=android-app
          cd android-app
          # بناء ملف الـ APK (Unsigned / Release APK)
          bubblewrap build

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: AlMajd-Attendance-App
          path: android-app/*.apk
